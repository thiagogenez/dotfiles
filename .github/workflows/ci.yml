name: CI

on:
  # Pull requests already run this workflow, so pushes are limited to the
  # default branch. Every other push arrives through a pull request.
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, so a secret committed long ago is still found even if no pull
    # request touches the repository.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Checksums are deliberately kept whole so they can be copied and verified.
# yamllint disable rule:line-length
env:
  # Binaries are pinned and checksum-verified rather than pulled through a
  # third-party action, so the supply chain here is GitHub releases only.
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  SHFMT_VERSION: v3.13.1
  SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
# yamllint enable rule:line-length

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          # Move it off the versioned path so nothing else repeats the version.
          mv "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /tmp/shellcheck
          chmod +x /tmp/shellcheck

      - name: Install shfmt
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          chmod +x /tmp/shfmt

      - name: Run shell lint
        env:
          DOTFILES_SHELLCHECK_BIN: /tmp/shellcheck
          DOTFILES_SHFMT_BIN: /tmp/shfmt
        run: bash scripts/lint.sh

      - name: Test pull request tooling
        run: |
          bash tests/pr-body-test.sh
          bash tests/pre-commit-test.sh

      - name: Run Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history: the point is to catch a secret committed at any time,
          # not only one added by the change under review.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Scan history
        run: /tmp/gitleaks git --no-banner --redact --verbose .

  lifecycle:
    name: Install and uninstall (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test installer lifecycle
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            PATH=/bin:/usr/bin /bin/bash tests/install-uninstall.sh
          else
            /bin/bash tests/install-uninstall.sh
          fi

      - name: Assert the architecture invariant
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            PATH=/bin:/usr/bin /bin/bash tests/architecture.sh
          else
            /bin/bash tests/architecture.sh
          fi

  coverage:
    name: Shell coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"

      - name: Install coverage tools
        run: |
          gem install bashcov --version 3.3.0 --no-document
          gem install simplecov-cobertura --version 3.1.2 --no-document

      - name: Generate coverage report
        run: |
          bashcov --bash-path /bin/bash tests/install-uninstall.sh
          bashcov --bash-path /bin/bash tests/architecture.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage/coverage.xml
          use_oidc: true
