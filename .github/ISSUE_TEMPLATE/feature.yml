name: Feature
description: Add a capability that does not exist yet
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: >
        Examples use fictional paths and identities, such as `~/src/dotfiles` or
        `personal@example.com`. This repository is public, and a real path names a machine
        and a person.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What is missing, and what someone has to do today because it is missing. Show the
        workaround if there is one.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What the capability does and how it behaves.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: >
        Why this is worth adding, and who has the problem. If you rejected another
        approach, the reason belongs here rather than in a section of its own.
    validations:
      required: true

  - type: textarea
    id: fit
    attributes:
      label: Fit
      description: >
        This project is a Bash installer with no service, runtime, or frontend. Explain
        what this has to act on here. Tooling aimed at long-running applications usually
        has no target in this repository.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: >
        Bash 3.2 compatibility, no new runtime dependencies, and anything else the
        implementation must respect.
    validations:
      required: false
